# ace-bridge: several ACE 2 Pro units daisy-chained on ONE cable.
# Starts the bridge (if it is not running) before [ace] loads, and waits until
# its virtual ports /tmp/ace-bridge/ace0, ace1, ... exist. Unit order lives in
# config/ace-bridge.json. Log: logs/ace-bridge.log.
# Blink a unit:  python3 /home/lava/printer_data/ace-bridge/ace_bridge.py --identify ace1
[ace_bridge]
